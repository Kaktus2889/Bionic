[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"

[project]
name="ai-company-api"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","pydantic-settings>=2.6,<3","alembic>=1.14,<2","redis>=5,<6"]

[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.28,<1","ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths=["tests"]
